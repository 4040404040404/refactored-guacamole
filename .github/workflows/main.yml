name: Playwright Site Chain - Independent Jobs

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Website URL to process'
        required: false
        default: 'https://zealous-river-220556.puter.site'

  push:
    branches:
      - main
      - master

  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: playwright-site-chain
  cancel-in-progress: false

jobs:
  run-site-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      next_site: ${{ steps.run-script.outputs.next_site }}
      chain_finished: ${{ steps.run-script.outputs.chain_finished }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium & system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Automation Script
        id: run-script
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://zealous-river-220556.puter.site' }}
        run: |
          output=$(xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node run-finale.js "$TARGET_URL" 2>&1)
          echo "$output"
          
          # Extract NEXT_SITE from output
          next_site=$(echo "$output" | grep "^NEXT_SITE=" | cut -d'=' -f2)
          if [ -n "$next_site" ]; then
            echo "next_site=$next_site" >> $GITHUB_OUTPUT
          fi
          
          # Check if chain finished
          if echo "$output" | grep -q "^CHAIN_FINISHED=true"; then
            echo "chain_finished=true" >> $GITHUB_OUTPUT
          fi

  trigger-next-job:
    needs: run-site-automation
    if: needs.run-site-automation.outputs.next_site != '' && needs.run-site-automation.outputs.chain_finished != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Next Site Job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_SITE: ${{ needs.run-site-automation.outputs.next_site }}
        run: |
          echo "🚀 Triggering next job for: $NEXT_SITE"
          gh workflow run "${{ github.workflow }}" \
            --ref "${{ github.ref_name }}" \
            -f target_url="$NEXT_SITE"

  completion-notification:
    needs: run-site-automation
    if: needs.run-site-automation.outputs.chain_finished == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Chain Completed
        run: |
          echo "✅ Site chain automation completed successfully!"
          echo "All 9 sites have been processed."
